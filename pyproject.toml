
[build-system]
requires = ["hatchling","hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "CampusDesk"
version = "1.0.0"
authors = [
  { name="Aditya Sharma", email="asharma3_be24@thapar.edu" },
  { name="Lakshay Jindal", email="ljindal_be24@thapar.edu" },
  { name="Harshveer", email="harshveer_be24@thapar.edu" },
  { name="Aditya Chopra", email="achopra_be24@thapar.edu" },
]
description = "CampusDesk: Thapar Classroom Availability & Scheduling Platform (UCS503)"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    # See: https://pypi.org/classifiers/
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
]
dependencies = ["click"]

[project.urls]
Homepage = "https://github.com/aditya-sharma-devs/CampusDesk"
Issues = "https://github.com/aditya-sharma-devs/CampusDesk/issues"

# Adapted from https://stackoverflow.com/a/50156706
[tool.pytest.ini_options]
pythonpath = [
  "code"
]
# THE END -------------------------------------------
